#
# Compile a new CV (PDF format) when a new version-tagged
# commit is pushed.
#

name: Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    # Only run if the trigger was a tag push.
    if: github.ref_type == 'tag'

    permissions:
      contents: write # Required to create releases
      packages: write # Required to upload packages

    steps:
      - name: Checkout version tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checks out the specific tag
          fetch-depth: 0 # Full history for proper versioning

      - name: Debugging
        run: |
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_REF_TYPE: ${{ github.ref_type }}"

          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION"
          echo "tag=${GITHUB_REF#refs/tags/}"

      - name: Extract version number from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract release notes from tag message
        id: tag_message
        run: |
          # `%(contents)` includes the PGP signature block for signed tags, so strip
          # everything from the "-----BEGIN PGP SIGNATURE-----" marker onward.
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ steps.version.outputs.tag }} | sed '/-----BEGIN PGP SIGNATURE-----/,$d')

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Install mise, which then installs the TinyTeX pinned in `mise.toml`.
      # Pinned to a commit SHA, per TS-60.
      # https://github.com/jdx/mise-action
      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21

      # The same install and build scripts as on the host and in the
      # devcontainer, so the released PDF is identical to a local build.
      # `run/build` stamps the CV with the latest tag, which is the one being
      # released, since the full history is checked out at that tag.
      - name: Install LaTeX packages
        run: sh run/install

      - name: Build PDF
        run: sh run/build

      - name: Verify artifact was created
        run: |
          echo "Checking for built artifacts..."
          ls -la dist/

          if [ ! -f "dist/kieran-potts-cv.pdf" ]; then
            echo "Error: Main artifact not found!"
            exit 1
          fi

          echo "Artifact verification successful!"

      # @deprecated - swapped for release artifact (see below).
      #- name: Upload PDF artifact
      #  uses: actions/upload-artifact@v4.4.3
      #  with:
      #    name: kieran-potts-cv.pdf
      #    path: ./dist/kieran-potts-cv.pdf
      #    retention-days: 5

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.tag_message.outputs.release_notes }}
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/kieran-potts-cv.pdf
          asset_name: kieran-potts-cv.pdf
          asset_content_type: application/pdf
